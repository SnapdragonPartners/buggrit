name: buggrit review

# The reusable workflow other repos call (docs/design.md §3, §12 step 7):
#
#   jobs:
#     buggrit:
#       uses: SnapdragonPartners/buggrit/.github/workflows/review.yml@<release commit SHA> # vX.Y.Z
#       secrets: inherit
#
# On main this workflow uses buggrit's own actions at @v0. Each release's copy
# names that release instead (scripts/pin-release.sh), so a caller pinned to a
# release's SHA runs exactly that release; @v0 follows the newest one
# (docs/releasing.md).
#
# The caller keeps its triggers and its concurrency group, since both have to
# be on the calling workflow (design §3); README.md has the full snippet.
# This job is the one buggrit.yml runs, except that it installs a release
# binary through the composite action instead of building main.
#
# A push runs a full pass, and so does a dispatch, at the PR's current head
# (design §2).
#
# When the org sets BUGGRIT_CLOUDSQL_INSTANCE, the job also connects to
# buggrit's optional database through the Cloud SQL Auth Proxy, with keyless
# federated credentials (design §3, "Database"). That needs the caller to
# grant id-token: write. If any database step fails, the review runs without
# it and buggrit warns on the PR.
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label; it must be able to reach the model endpoint
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Job timeout; keep it above limits.pass_deadline so buggrit has time to publish
        type: number
        default: 70
      version:
        description: buggrit release to run (v0.1.0); defaults to the release this workflow comes from
        type: string
        default: ''

# No permissions block: the job takes the caller's, which the README's
# snippet sets to contents: read and id-token: write. A called workflow
# that asks for id-token: write fails to start in a caller that doesn't
# grant it, and the database is optional.

jobs:
  review:
    # review is the completion signal for a push's pass (design §8).
    name: review
    # Only pushes and dispatches run; a caller that still sends comment or
    # review events gets a skipped run (design §3, "Callers"). Skip drafts
    # and fork PRs, which get no secrets.
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      !github.event.pull_request.draft &&
      (!github.event.pull_request ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BUGGRIT_APP_ID }}
          private-key: ${{ secrets.BUGGRIT_APP_PRIVATE_KEY }}

      # While buggrit's repository is private, its release assets need an
      # authenticated download. This token reads buggrit's contents and
      # nothing else, so the review token stays scoped to the caller's repo.
      - name: Mint release download token
        id: download
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BUGGRIT_APP_ID }}
          private-key: ${{ secrets.BUGGRIT_APP_PRIVATE_KEY }}
          owner: SnapdragonPartners
          repositories: buggrit
          permission-contents: read

      # The PR's head now, not the event's (design §2).
      - name: Look up the PR head
        id: head
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          set -euo pipefail
          sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          [ -n "$sha" ] || { echo "could not resolve PR head" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.head.outputs.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      # The optional database (design §3, "Database"). A failure here
      # reaches buggrit as BUGGRIT_DATABASE_ERROR, and the run goes on.
      - name: Connect to the database
        id: db
        if: vars.BUGGRIT_CLOUDSQL_INSTANCE != ''
        uses: SnapdragonPartners/buggrit/.github/actions/database@v0
        with:
          instance: ${{ vars.BUGGRIT_CLOUDSQL_INSTANCE }}
          wif-provider: ${{ vars.BUGGRIT_GCP_WIF_PROVIDER }}
          service-account: ${{ vars.BUGGRIT_GCP_SERVICE_ACCOUNT }}

      # buggrit reads .github/buggrit.json from the base branch and stops
      # with a notice if there is none (design §4).
      - name: Review
        uses: SnapdragonPartners/buggrit@v0
        env:
          # The model key, under the name api_key_env gives. These are the
          # two names this workflow passes through.
          LUNAROUTE_API_KEY: ${{ secrets.LUNAROUTE_API_KEY }}
          BUGGRIT_LLM_API_KEY: ${{ secrets.BUGGRIT_LLM_API_KEY }}
          BUGGRIT_DATABASE_URL: ${{ steps.db.outputs.url }}
          BUGGRIT_DATABASE_ERROR: ${{ steps.db.outputs.error }}
          # The rate limits shared across repositories (design §9); used only
          # with the database.
          BUGGRIT_RATE_LIMITS: ${{ vars.BUGGRIT_RATE_LIMITS }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          download-token: ${{ steps.download.outputs.token }}
          pr: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          workspace: ${{ github.workspace }}/pr
          version: ${{ inputs.version }}
