name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Pinned tool versions. Bumping one is intentional and changes the cache key,
# so the next run reinstalls.
env:
  GOLANGCI_VERSION: v1.64.8
  GOVULNCHECK_VERSION: v1.1.4
  SQLC_VERSION: v1.31.1

jobs:
  checks:
    runs-on: ubuntu-latest

    # The store's Postgres tests run against this (internal/store).
    services:
      postgres:
        image: postgres:18
        env:
          # A throwaway container: trust auth, so no password at all.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cache Go tool binaries
        id: cache-go-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-golangci-${{ env.GOLANGCI_VERSION }}-vuln-${{ env.GOVULNCHECK_VERSION }}-sqlc-${{ env.SQLC_VERSION }}

      - name: Install Go tools
        if: steps.cache-go-tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@${{ env.SQLC_VERSION }}

      - name: Download Go module dependencies
        run: go mod download

      - name: Lint
        run: make lint

      - name: Generated code
        run: make sqlc-verify

      - name: Vulnerability check
        run: make vuln

      - name: Build
        run: make build

      - name: Unit tests
        env:
          BUGGRIT_POSTGRES_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable
          # Fail rather than skip if the service isn't wired up.
          BUGGRIT_POSTGRES_REQUIRED: "1"
        run: make test
