name: buggrit

# buggrit reviews its own pull requests (docs/design.md §11, build step 3).
#
# It runs the buggrit built from main, not from the PR, and reads
# .github/buggrit.json from the base branch, so nothing the PR changes runs
# with the App token or the LunaRoute key (design §4, §10). It builds from
# source rather than using a release, so it's the canary for each merge;
# other repos call the reusable review.yml instead (design §3).
#
# A push runs a full pass. Comments and reviews trigger nothing: a finding is
# settled by resolving its thread, and Actions has no trigger for that, so
# after resolving threads the agent dispatches a sync run, which runs no
# model (design §2, §3).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
      mode:
        description: full (rerun the pass at the current head) or sync (re-read the threads, no model)
        type: choice
        options: [full, sync]
        default: full

concurrency:
  # Sync runs have a group of their own, so they never replace a pending
  # push run (design §3, "Concurrency").
  group: ${{ inputs.mode == 'sync' && 'buggrit-sync' || 'buggrit' }}-${{ github.event.pull_request.number || inputs.pr }}
  # A push cancels the pass in flight; the new head gets its own. A newer
  # sync replaces one in flight. A full dispatch waits its turn.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.mode == 'sync' }}

permissions:
  contents: read

jobs:
  review:
    # review is the completion signal for a push's pass (design §8); a sync
    # run reports under its own name, so it can't hide a failing review.
    name: ${{ inputs.mode == 'sync' && 'sync' || 'review' }}
    # Skip drafts and fork PRs, which get no secrets.
    if: >-
      !github.event.pull_request.draft &&
      (!github.event.pull_request ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Above limits.pass_deadline (55m), so buggrit always has time to publish.
    timeout-minutes: 70
    steps:
      - name: Check out buggrit from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: buggrit-src
          persist-credentials: false

      # buggrit reads its config from the base branch, so without one on main
      # (as before the PR that added it) there is nothing to run.
      - name: Check for a config on main
        id: configured
        run: |
          if [ -f buggrit-src/.github/buggrit.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has no .github/buggrit.json yet; skipping the review."
          fi

      - name: Mint App token
        id: app
        if: steps.configured.outputs.ok == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BUGGRIT_APP_ID }}
          private-key: ${{ secrets.BUGGRIT_APP_PRIVATE_KEY }}

      # The PR's head now, not the event's (design §2).
      - name: Look up the PR head
        id: head
        if: steps.configured.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          [ -n "$sha" ] || { echo "could not resolve PR head" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # A sync run reads no files.
      - name: Check out the PR head
        if: steps.configured.outputs.ok == 'true' && inputs.mode != 'sync'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.head.outputs.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        if: steps.configured.outputs.ok == 'true'
        with:
          go-version-file: buggrit-src/go.mod
          cache-dependency-path: buggrit-src/go.sum

      - name: Build buggrit
        if: steps.configured.outputs.ok == 'true'
        run: go build -C buggrit-src -o "$RUNNER_TEMP/buggrit" ./cmd/buggrit

      - name: Review
        if: steps.configured.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          BUGGRIT_PR: ${{ github.event.pull_request.number || inputs.pr }}
          BUGGRIT_MODE: ${{ inputs.mode }}
          LUNAROUTE_API_KEY: ${{ secrets.LUNAROUTE_API_KEY }}
        run: '"$RUNNER_TEMP/buggrit" review --workspace "$GITHUB_WORKSPACE/pr"'
