name: buggrit

# buggrit reviews its own pull requests (docs/design.md §11, build step 3).
#
# It runs the buggrit built from main, not from the PR, and reads
# .github/buggrit.json from the base branch, so nothing the PR changes runs
# with the App token or the LunaRoute key (design §4, §10). It builds from
# source rather than using a release, so it's the canary for each merge;
# other repos call the reusable review.yml instead (design §3).
#
# Replies and reviews trigger runs too (design §3). A run at a head that
# already has a complete pass only reconciles: it verifies open findings and
# answers replies, without a new full pass (design §2, step 0).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

concurrency:
  # Events caused by buggrit's own reviews and replies, and on a public
  # repository by comments from outside the team, get a throwaway group, so
  # they never replace a pending run queued by a teammate (design §3, "Bot
  # events" and "Outside events"). The job-level if then skips them.
  group: >-
    ${{ (github.event.comment.user.login == 'buggrit-bot[bot]' ||
         github.event.review.user.login == 'buggrit-bot[bot]' ||
         (github.event_name == 'pull_request_review_comment' && !github.event.repository.private &&
          !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association)) ||
         (github.event_name == 'pull_request_review' && !github.event.repository.private &&
          !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.review.author_association)))
        && format('buggrit-ignored-{0}', github.run_id)
        || format('buggrit-{0}', github.event.pull_request.number || inputs.pr) }}
  # A push cancels the pass in flight; the new head gets its own.
  # Reply-triggered runs wait their turn.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  review:
    # Events caused by buggrit's own comments report under their own check
    # name, so their skipped runs never hide the real review (design §3,
    # "Bot events"; §8, "Completion signal"). GitHub doesn't evaluate a
    # skipped job's name, so those runs, like every other skipped run,
    # show this expression's text.
    name: >-
      ${{ (github.event.comment.user.login == 'buggrit-bot[bot]' ||
           github.event.review.user.login == 'buggrit-bot[bot]')
          && 'ignored bot event' || 'review' }}
    # Skip drafts, fork PRs (they get no secrets), events caused by
    # buggrit's own comments, and, on a public repository, comments and
    # reviews from outside the team (design §3, "Outside events").
    # CONTRIBUTOR passes because an org member whose membership is private
    # can show as one; the engine checks each reply's author again, by
    # permission, so this test only saves the runner and the model capacity.
    if: >-
      !github.event.pull_request.draft &&
      (!github.event.pull_request ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      github.event.comment.user.login != 'buggrit-bot[bot]' &&
      github.event.review.user.login != 'buggrit-bot[bot]' &&
      (github.event_name != 'pull_request_review_comment' || github.event.repository.private ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association)) &&
      (github.event_name != 'pull_request_review' || github.event.repository.private ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    # Above limits.pass_deadline (55m), so buggrit always has time to publish.
    timeout-minutes: 70
    steps:
      - name: Check out buggrit from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: buggrit-src
          persist-credentials: false

      # buggrit reads its config from the base branch, so without one on main
      # (as before the PR that added it) there is nothing to run.
      - name: Check for a config on main
        id: configured
        run: |
          if [ -f buggrit-src/.github/buggrit.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has no .github/buggrit.json yet; skipping the review."
          fi

      - name: Mint App token
        id: app
        if: steps.configured.outputs.ok == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BUGGRIT_APP_ID }}
          private-key: ${{ secrets.BUGGRIT_APP_PRIVATE_KEY }}

      # The PR's head now, not the event's (design §2).
      - name: Look up the PR head
        id: head
        if: steps.configured.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          [ -n "$sha" ] || { echo "could not resolve PR head" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the PR head
        if: steps.configured.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.head.outputs.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        if: steps.configured.outputs.ok == 'true'
        with:
          go-version-file: buggrit-src/go.mod
          cache-dependency-path: buggrit-src/go.sum

      - name: Build buggrit
        if: steps.configured.outputs.ok == 'true'
        run: go build -C buggrit-src -o "$RUNNER_TEMP/buggrit" ./cmd/buggrit

      - name: Review
        if: steps.configured.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          BUGGRIT_PR: ${{ github.event.pull_request.number || inputs.pr }}
          LUNAROUTE_API_KEY: ${{ secrets.LUNAROUTE_API_KEY }}
        run: '"$RUNNER_TEMP/buggrit" review --workspace "$GITHUB_WORKSPACE/pr"'
