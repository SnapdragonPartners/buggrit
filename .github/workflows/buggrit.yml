name: buggrit

# buggrit reviews its own pull requests (docs/design.md §11, build step 3).
#
# It runs the buggrit built from main, not from the PR, and reads
# .github/buggrit.json from the base branch, so nothing the PR changes runs
# with the App token or the LunaRoute key (design §4, §10). Until build
# step 7 ships the composite action, it builds from source.
#
# Replies and reviews trigger runs too (design §3). A run at a head that
# already has a complete pass only reconciles: it verifies open findings and
# answers replies, without a new full pass (design §2, step 0).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

concurrency:
  # Events caused by buggrit's own reviews and replies get a throwaway group,
  # so they never replace a pending run queued by a human (design §3, "Bot
  # events"). The job-level if then skips them.
  group: >-
    ${{ (github.event.comment.user.login == 'buggrit-bot[bot]' ||
         github.event.review.user.login == 'buggrit-bot[bot]')
        && format('buggrit-ignored-{0}', github.run_id)
        || format('buggrit-{0}', github.event.pull_request.number || inputs.pr) }}
  # A push cancels the pass in flight; the new head gets its own.
  # Reply-triggered runs wait their turn.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  review:
    # Skip drafts, and skip events caused by buggrit's own comments.
    if: >-
      !github.event.pull_request.draft &&
      github.event.comment.user.login != 'buggrit-bot[bot]' &&
      github.event.review.user.login != 'buggrit-bot[bot]'
    runs-on: ubuntu-latest
    # Above limits.pass_deadline (55m), so buggrit always has time to publish.
    timeout-minutes: 70
    steps:
      - name: Check out buggrit from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: buggrit-src
          persist-credentials: false

      # buggrit reads its config from the base branch, so without one on main
      # (as before the PR that added it) there is nothing to run.
      - name: Check for a config on main
        id: configured
        run: |
          if [ -f buggrit-src/.github/buggrit.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has no .github/buggrit.json yet; skipping the review."
          fi

      - name: Mint App token
        id: app
        if: steps.configured.outputs.ok == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BUGGRIT_APP_ID }}
          private-key: ${{ secrets.BUGGRIT_APP_PRIVATE_KEY }}

      # The PR's head now, not the event's (design §2).
      - name: Look up the PR head
        id: head
        if: steps.configured.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          [ -n "$sha" ] || { echo "could not resolve PR head" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the PR head
        if: steps.configured.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.head.outputs.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        if: steps.configured.outputs.ok == 'true'
        with:
          go-version-file: buggrit-src/go.mod
          cache-dependency-path: buggrit-src/go.sum

      - name: Build buggrit
        if: steps.configured.outputs.ok == 'true'
        run: go build -C buggrit-src -o "$RUNNER_TEMP/buggrit" ./cmd/buggrit

      - name: Review
        if: steps.configured.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          BUGGRIT_PR: ${{ github.event.pull_request.number || inputs.pr }}
          LUNAROUTE_API_KEY: ${{ secrets.LUNAROUTE_API_KEY }}
        run: '"$RUNNER_TEMP/buggrit" review --workspace "$GITHUB_WORKSPACE/pr"'
