name: release

# Publishes the binaries the composite action downloads (docs/design.md §3,
# §12 step 7). Releases are cut with scripts/release.sh (make release), which
# pushes a vX.Y.Z tag on a release commit: main's commit plus review.yml
# pinned to that tag (docs/releasing.md). This workflow checks the commit is
# exactly that, then goreleaser builds and uploads the archives and
# checksums.txt. release.sh then moves v0 with the releaser's credentials: no
# token a workflow can hold may move it (ADR 0002).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # One group per tag. A shared group keeps only one pending run, so a
    # third overlapping tag would drop the second's release.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Catches a mistake, such as main's own commit tagged by hand: only a
      # release commit publishes. It isn't what keeps others out, since a
      # tag's own copy of this workflow could drop it; the tag ruleset is.
      - name: Check the release commit
        run: scripts/verify-release.sh "$GITHUB_REF_NAME" origin/main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
