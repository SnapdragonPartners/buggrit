name: release

# Publishes the binaries the composite action downloads (docs/design.md §3,
# §12 step 7). Releases are cut with scripts/release.sh (make release), which
# pushes a vX.Y.Z tag on a release commit: main's commit plus review.yml
# pinned to that tag (docs/releasing.md). This workflow checks the commit is
# exactly that, goreleaser builds and uploads the archives and checksums.txt,
# and then the moving major tag (v0) follows the newest published release of
# its major version.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # One group per tag. A shared group keeps only one pending run, so a
    # third overlapping tag would drop the second's release.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Catches a mistake, such as main's own commit tagged by hand: only a
      # release commit publishes. It isn't what keeps others out, since a
      # tag's own copy of this workflow could drop it; the tag ruleset is.
      - name: Check the release commit
        run: scripts/verify-release.sh "$GITHUB_REF_NAME" origin/main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Clients pin @v0. This job doesn't move a tag to this run's release; for
  # every major, it moves the major tag to that major's newest published
  # final release, read fresh. So a patch to an older line never moves a
  # tag backward, and if the shared group drops a pending run, the run that
  # replaced it arrived later and reconciles every major from releases
  # published before it.
  #
  # The tag ruleset lets only admins and the buggrit-bot App move v* tags
  # (docs/releasing.md), so the push uses an App token, which can't be
  # GITHUB_TOKEN: GitHub won't put it on a ruleset's bypass list. A moved
  # v0 matches no trigger, so it starts no workflow run.
  major:
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: release-major
      cancel-in-progress: false
    steps:
      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BUGGRIT_APP_ID }}
          private-key: ${{ secrets.BUGGRIT_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Move the major tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          finals=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
                     --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' |
                   { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V)
          for major in $(sed 's/\..*//' <<< "$finals" | sort -u); do
            newest=$(grep -E "^${major}\." <<< "$finals" | tail -n1)
            target=$(git rev-list -n1 "refs/tags/$newest")
            if [ "$(git rev-list -n1 "refs/tags/$major" 2>/dev/null || true)" = "$target" ]; then
              echo "$major already points at $newest."
              continue
            fi
            git tag -f "$major" "$target"
            git push -f origin "refs/tags/$major"
            echo "::notice::$major now points at $newest."
          done
