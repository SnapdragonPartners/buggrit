name: release

# Publishes the binaries the composite action downloads (docs/design.md §3,
# §12 step 7). Push an immutable vX.Y.Z tag from main; goreleaser builds and
# uploads the archives and checksums.txt, then the moving major tag (v0)
# follows the newest release of its major version.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Clients pin @v0. Move it only for a final release that is the newest
      # of its major, so a patch to an older line never moves it backward.
      # A tag pushed with GITHUB_TOKEN doesn't start another workflow run.
      - name: Move the major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$TAG is a pre-release; the major tag stays put."
            exit 0
          fi
          major="${TAG%%.*}"
          newest=$(git tag -l "$major.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ "$newest" != "$TAG" ]; then
            echo "::notice::$newest is newer than $TAG; $major stays put."
            exit 0
          fi
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
          echo "::notice::$major now points at $TAG."
