run:
  timeout: 10m
  modules-download-mode: readonly

linters:
  enable:
    # Core formatting and imports.
    - gofmt
    - goimports
    - gci

    # Essential checks.
    - govet
    - typecheck
    - staticcheck
    - unused
    - ineffassign
    - misspell

    # Error handling.
    - errcheck
    - errorlint
    - wrapcheck

    # Code quality and maintainability.
    - gosimple
    - goconst
    - unconvert
    - unparam
    - revive
    - cyclop
    - dupl
    - maintidx

    # Security.
    - gosec
    - bodyclose
    - noctx

    # Nil safety.
    - nilerr
    - nilnesserr
    - nilnil
    - forcetypeassert

    # Performance and resource management.
    - makezero
    - prealloc
    - containedctx
    - contextcheck

    # Best practices.
    - copyloopvar
    - gocritic
    - gochecknoinits
    - gochecknoglobals
    - gomodguard

    # Style and consistency.
    - stylecheck
    - whitespace
    - dogsled
    - nakedret
    - predeclared

    # Documentation.
    - godot

linters-settings:
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/SnapdragonPartners/buggrit)
    skip-generated: true

  goconst:
    min-len: 3
    min-occurrences: 3
    ignore-tests: true
    match-constant: true
    numbers: false
    ignore-calls: true

  govet:
    enable:
      - shadow
      - nilness
      - unusedwrite
      - fieldalignment
      - sortslice

  staticcheck:
    checks: ["all"]

  gosec:
    severity: medium
    confidence: medium
    config:
      G302: "0644"
      G306: "0644"

  cyclop:
    max-complexity: 15
    package-average: 10.0
    skip-tests: true

  maintidx:
    under: 20

  dupl:
    threshold: 100

  revive:
    severity: warning
    rules:
      - name: exported
        severity: error
        disabled: false
      - name: unexported-return
        severity: warning
        disabled: false
      - name: unused-parameter
        severity: warning
        disabled: false
      - name: unreachable-code
        severity: error
        disabled: false
      - name: redefines-builtin-id
        severity: error
        disabled: false
      - name: superfluous-else
        severity: warning
        disabled: false
      - name: var-naming
        severity: warning
        disabled: false
        arguments:
          - ["ID", "HTTP", "JSON", "API", "URI", "URL", "LLM", "AI", "OS"]

  contextcheck:
    check-generated: false

  wrapcheck:
    ignoreSigs:
      - .Errorf(
      - errors.New(
      - errors.Unwrap(
      - .Wrap(
      - .Wrapf(
    ignoreSigRegexps:
      - \.New.*Error\(

  errorlint:
    errorf: true
    asserts: true
    comparison: true

  unparam:
    check-exported: false

  nakedret:
    max-func-lines: 30

  dogsled:
    max-blank-identifiers: 3

  prealloc:
    simple: true
    range-loops: true
    for-loops: false

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc
      - importShadow
      - unnamedResult
    settings:
      captLocal:
        paramsOnly: true
      rangeValCopy:
        sizeThreshold: 32

  gomodguard:
    blocked:
      modules:
        - github.com/pkg/errors:
            recommendations:
              - errors
              - fmt
            reason: "Use standard library errors and fmt.Errorf instead"
      local_replace_directives: false

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

  exclude-rules:
    # Test files: be more lenient.
    - path: "_test\\.go"
      linters:
        - errcheck
        - goconst
        - gocritic
        - cyclop
        - maintidx
        - dupl
        - gochecknoglobals
        - gochecknoinits
        - gosec
        - wrapcheck
        - prealloc
        - unparam
        - containedctx
        - contextcheck

    # Main files: CLI entry points have different patterns.
    - path: "cmd/.*/main\\.go"
      linters:
        - gochecknoglobals
        - gochecknoinits
        - cyclop

    # Config parsing can be complex.
    - path: "internal/config/.*\\.go"
      linters:
        - cyclop
        - maintidx

    # Generated and mock files.
    - path: "\\.pb\\.go"
      linters:
        - stylecheck
        - unused
        - govet

    - path: "mock.*\\.go"
      linters:
        - unused
        - unparam
        - gocritic

    # Disable fieldalignment for test files.
    - linters:
        - govet
      text: "fieldalignment:"
      path: "_test\\.go"

    # Allow TODO comments.
    - linters:
        - godox
      text: "TODO:"

    # Allow context.Background in main and setup.
    - linters:
        - contextcheck
      text: "Non-inherited new context"
      path: "cmd/.*/main\\.go"

  exclude-dirs:
    - vendor
    - node_modules
    - .git
